# DMG universale (Apple Silicon + Intel in un solo file).
# - Push su main: controlli + DMG come artifact (ogni commit ha la sua build di prova).
# - Tag v* (es. v0.1.0): in più crea la GitHub Release con il DMG e i checksum.
# - Avvio manuale (Actions ▸ Release ▸ Run workflow): come un push.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

# Un push nuovo annulla la build superata dello stesso ramo (le release non si annullano).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-26
    # I fork non usano i runner macOS per questo workflow.
    if: github.repository_owner == 'peppolone'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Strumenti
        run: |
          xcodebuild -version
          node -v

      - name: Controlli del motore
        run: |
          npm ci
          npm run typecheck
          npm run test:chaos

      - name: Versione
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then V="${GITHUB_REF_NAME#v}"; else V="$(node -p 'require("./package.json").version')"; fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "Versione: $V"

      - name: Compilazione e DMG universale
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          SIGNING_P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
          SIGNING_P12_BASE64: ${{ secrets.SIGNING_P12_BASE64 }}
        run: |
          mkdir -p out
          # Certificato autofirmato del progetto: stessa identità a ogni versione (Portachiavi).
          export SIGNING_P12="$RUNNER_TEMP/signing.p12"
          printf '%s' "$SIGNING_P12_BASE64" | base64 -D > "$SIGNING_P12"
          scripts/fetch-node.sh universal "$RUNNER_TEMP/node/node"
          ARCHS="arm64 x86_64" NODE_BIN="$RUNNER_TEMP/node/node" zsh scripts/build-app.sh
          echo "Eseguibile: $(lipo -archs dist/Conclave.app/Contents/MacOS/Conclave) · Node: $(lipo -archs dist/Conclave.app/Contents/MacOS/node)"
          codesign --verify --deep --strict dist/Conclave.app
          scripts/make-dmg.sh dist/Conclave.app "out/Conclave-$VERSION.dmg"
          (cd out && shasum -a 256 *.dmg > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Prova di avvio del motore incluso (arm64 e, con Rosetta, x86_64)
        run: |
          hdiutil attach -nobrowse -mountpoint "$RUNNER_TEMP/dmg" "out/Conclave-$VERSION.dmg" >/dev/null
          APP="$RUNNER_TEMP/dmg/Conclave.app"
          engine() {  # $1 = architettura; il motore deve scrivere la sua porta
            local DATA="$(mktemp -d)"
            COUNCIL_DATA="$DATA" PORT=0 arch "-$1" "$APP/Contents/MacOS/node" --disable-warning=ExperimentalWarning \
              "$APP/Contents/Resources/server/src/server.ts" > "$DATA/out.log" 2>&1 &
            local PID=$!
            for i in {1..30}; do grep -q COUNCIL_PORT "$DATA/out.log" && break; sleep 1; done
            kill $PID 2>/dev/null || true
            grep -q COUNCIL_PORT "$DATA/out.log" && echo "motore $1: OK ($(arch -$1 "$APP/Contents/MacOS/node" -v))" \
              || { echo "motore $1: FALLITO"; cat "$DATA/out.log"; return 1; }
          }
          engine arm64
          if arch -x86_64 /usr/bin/true 2>/dev/null; then engine x86_64; else echo "Rosetta assente: x86_64 non provato"; fi
          hdiutil detach "$RUNNER_TEMP/dmg" >/dev/null

      # Un solo file e archive: false → si scarica direttamente il .dmg, senza zip.
      - uses: actions/upload-artifact@v7
        with:
          path: out/Conclave-${{ env.VERSION }}.dmg
          archive: false
          if-no-files-found: error

      - name: GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* --title "Conclave $VERSION" --generate-notes --verify-tag
