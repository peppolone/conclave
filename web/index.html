<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Council</title>
  <link rel="stylesheet" href="style.css">
  <!-- Nell'app Mac applica subito la classe native (niente lampo della barra laterale web);
       app.js la conferma o la toglie dopo /api/models. -->
  <script>if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.council) document.documentElement.classList.add("native");</script>
</head>
<body>
  <aside id="sidebar">
    <button id="new-btn" class="primary wide">+ Nuova discussione</button>
    <h2>Cronologia</h2>
    <input id="search" type="search" placeholder="Cerca nelle discussioni…" aria-label="Cerca nella cronologia" autocomplete="off">
    <ul id="history"></ul>
    <button id="settings-btn" class="ghost wide settings" hidden>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      Impostazioni e chiavi API
    </button>
  </aside>

  <main>
    <section id="composer">
      <h1>AI Council</h1>
      <p class="sub" id="sub"></p>
      <div id="parent-tag" class="parent-tag" hidden>
        <span></span>
        <button type="button" class="x" title="Annulla approfondimento" aria-label="Annulla approfondimento">×</button>
      </div>
      <!-- Composer unico: domanda sopra, opzioni compatte e invio sul bordo inferiore. -->
      <div class="composer-box">
        <textarea id="question" rows="3" placeholder="Fai una domanda al consiglio…"></textarea>
        <!-- Chi partecipa: un pulsante per modello, acceso = partecipa. -->
        <div class="composer-row">
          <span class="row-label" id="who-title">Partecipano</span>
          <div id="models" class="toggles" role="group" aria-labelledby="who-title"></div>
        </div>
        <div class="composer-bar">
          <label class="pill pill-select" title="Quanti round di discussione">
            <span class="pill-label">Round</span>
            <select id="rounds-select" aria-label="Round">
              <option value="3">3 – completo</option>
              <option value="2">2 – fino alla revisione</option>
              <option value="1">1 – solo critica</option>
              <option value="0">0 – solo risposte, veloce</option>
            </select>
            <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5"/></svg>
          </label>
          <label class="pill pill-select" title="Chi legge il dibattito ed emette il verdetto finale">
            <span class="pill-label">Giudice</span>
            <select id="judge" aria-label="Giudice"></select>
            <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5"/></svg>
          </label>
          <span class="bar-spacer"></span>
          <button type="button" id="start-btn" class="send" title="Avvia dibattito (⌘↩)" aria-label="Avvia dibattito">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
          </button>
        </div>
      </div>
      <p id="hint" class="hint muted"></p>
    </section>

    <section id="debate" hidden>
      <div class="debate-head">
        <h2 id="debate-q"></h2>
        <p id="debate-meta" class="meta muted"></p>
        <div class="row">
          <span id="status" class="status"></span>
          <button id="cancel-btn" class="ghost" hidden>Annulla</button>
        </div>
      </div>
      <div id="actions" class="actions" hidden>
        <button type="button" class="ghost" data-action="copy">Copia verdetto</button>
        <button type="button" class="ghost" data-action="export">Esporta Markdown</button>
        <button type="button" class="ghost" data-action="deepen">Approfondisci</button>
        <span id="action-msg" class="muted" aria-live="polite"></span>
      </div>
      <article id="verdict" class="verdict" hidden></article>
      <div id="phases"></div>
    </section>
  </main>

  <script src="app.js" type="module"></script>
</body>
</html>
